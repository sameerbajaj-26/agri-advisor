[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-advisor-backend"
version = "0.1.0"
description = "Multilingual agritech advisory assistant - API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "diskcache>=5.6",
  "tzdata>=2024.1",  # IANA zones on Windows (forecast timezone handling)
]

[project.optional-dependencies]
rag = [
  "pymupdf>=1.24",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["diskcache", "diskcache.*", "pymupdf", "pymupdf.*", "chromadb", "chromadb.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["app.rag.parse", "tests.test_rag"]
disallow_untyped_calls = false  # pymupdf is not fully typed

[tool.ruff.lint.per-file-ignores]
"app/agent/i18n.py" = ["E501"]  # human-written multilingual strings
"app/agent/prompts.py" = ["E501"]  # prompt prose
"tests/*" = ["E501"]  # long literals in fixtures
